<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UIT APP - Image Analysis for Testing</title>
    <link rel="stylesheet" href="styles.css">
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
</head>
<body>

            </svg>
            SnapScene</h1>
        <div class="header-actions">
            <span id="statusIndicator" class="status-dot" title="Connected - Ready for analysis"></span>
            <button id="openSettings" class="header-button">⚙️ Settings</button>
        </div>
    </header>

    <main>
        <!-- Image Upload Section -->
        <section class="card">
            <h2>📤 Upload Image</h2>
            
            <div class="upload-container">
                <input type="file" id="imageUpload" accept="image/*" style="display: none;">
                
                <!-- Upload Area -->
                <div class="upload-area" id="uploadArea">
                    <div class="upload-icon">📸</div>
                    <div class="upload-text">Drop your image here</div>
                    <div class="upload-subtext">or click to browse</div>
                    <div class="upload-formats">Supports: PNG, JPG, JPEG, WEBP</div>
                </div>

                <!-- Image Preview -->
                <div id="imagePreviewContainer" class="image-preview-container" style="display: none;">
                    <img id="previewImage" class="preview-image" src="" alt="Preview">
                    <div class="image-info">
                        <span id="imageSize"></span> • <span id="imageDimensions"></span>
                    </div>
                </div>
            </div>
        </section>

        <!-- Analysis Configuration -->
        <section class="card">
            <h2>🔬 Analysis Configuration</h2>
            
            <div class="config-row">
                <div class="config-group">
                    <label for="testTypeSelector">Test Type:</label>
                    <select id="testTypeSelector">
                        <option value="general">🔍 General Analysis</option>
                        <option value="functional">⚙️ Functional Testing</option>
                        <option value="ui">🎨 UI Testing</option>
                        <option value="performance">⚡ Performance Testing</option>
                        <option value="security">🔒 Security Testing</option>
                        <option value="accessibility">♿ Accessibility Testing</option>
                        <option value="usability">👤 Usability Testing</option>
                        <option value="compatibility">🔄 Compatibility Testing</option>
                    </select>
                </div>

                <div class="config-group">
                    <label for="detailLevel">Detail Level:</label>
                    <select id="detailLevel">
                        <option value="basic">Basic (5-10 scenarios)</option>
                        <option value="detailed">Detailed (10-20 scenarios)</option>
                        <option value="comprehensive">Comprehensive (20+ scenarios)</option>
                    </select>
                </div>
            </div>
        </section>

        <!-- Action Buttons -->
        <section class="card">
            <div class="button-group">
                <button id="analyzeButton" class="analyze-button" disabled>
                    <span id="analyzeText">🔍 Analyze Image</span>
                    <div id="analyzeSpinner" class="loading-spinner" style="display: none;"></div>
                </button>
                <button id="clearButton" class="clear-button">🗑️ Clear</button>
                <button id="saveButton" class="save-button" disabled>💾 Save</button>
                <button id="copyButton" class="copy-button" disabled>📋 Copy</button>
            </div>

            <!-- Progress Bar -->
            <div id="progressContainer" class="progress-container" style="display: none;">
                <div class="progress-bar">
                    <div class="progress-fill" id="progressFill"></div>
                </div>
                <div id="progressText" class="progress-text">Analyzing...</div>
            </div>
        </section>

        <!-- Results Section -->
        <section class="card" id="resultCard" style="display: none;">
            <div class="result-header">
                <h2>📊 Analysis Results</h2>
            </div>

            <!-- Analysis Summary -->
            <div class="analysis-summary" id="analysisSummary" style="display: none;">
                <div class="summary-grid">
                    <div class="summary-item">
                        <span class="summary-number" id="totalScenarios">0</span>
                        <span class="summary-label">Total Scenarios</span>
                    </div>
                    <div class="summary-item">
                        <span class="summary-number" id="highPriority">0</span>
                        <span class="summary-label">🔴 High Priority</span>
                    </div>
                    <div class="summary-item">
                        <span class="summary-number" id="mediumPriority">0</span>
                        <span class="summary-label">🟡 Medium Priority</span>
                    </div>
                    <div class="summary-item">
                        <span class="summary-number" id="lowPriority">0</span>
                        <span class="summary-label">🟢 Low Priority</span>
                    </div>
                </div>
            </div>

            <!-- Test Scenarios -->
            <div id="testScenarios" class="test-scenarios"></div>
        </section>

        <!-- History Section -->
        <section class="card" id="historyCard" style="display: none;">
            <h2>📜 Recent Analysis History</h2>
            <div id="historyList" class="history-list"></div>
        </section>
    </main>

    <script src="../js/renderer.js"></script>
</body>
</html>
